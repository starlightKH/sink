<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Laftel Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Laftel Sync</h1>
    <form id="connection-form">
      <label>
        서버 URL
        <input type="url" id="server-url" placeholder="ws://localhost:8080" required>
      </label>
      <label>
        룸 ID
        <input type="text" id="room-id" placeholder="예: friends-room" required>
      </label>
      <label class="tab-picker-label">
        동기화할 탭
        <div class="tab-picker">
          <select id="tab-select">
            <option value="">탭을 선택하세요</option>
          </select>
          <button type="button" id="refresh-tabs" class="secondary tab-refresh">새로고침</button>
        </div>
        <p class="tab-hint">열려 있는 영상 탭을 선택하면 해당 사이트에서도 동기화됩니다.</p>
      </label>
      <div class="actions">
        <button type="submit" id="connect-button">연결</button>
        <button type="button" id="disconnect-button" class="secondary">연결 해제</button>
      </div>
    </form>
    <section class="status">
      <h2>상태</h2>
      <p id="status-text">아직 연결되지 않음</p>
    </section>
    <section class="help">
      <h2>사용 방법</h2>
      <ol>
        <li>같은 룸 ID를 상대 PC에서 입력합니다.</li>
        <li>동기화할 브라우저 탭을 선택합니다.</li>
        <li>같은 서버 URL을 사용하여 연결합니다.</li>
        <li>선택한 탭에서 영상을 재생하면 상대방과 동기화됩니다.</li>
      </ol>
    </section>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
